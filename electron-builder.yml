appId: app.cmae.desktop
productName: CMAE
copyright: Copyright CMAE
directories:
  output: dist-desktop
  buildResources: desktop/build
# Pack shell from desktop-pack/ (plain or obfuscated) as desktop/
files:
  - from: desktop-pack
    to: desktop
  - package.json
afterPack: scripts/after-pack.cjs
afterSign: scripts/notarize.cjs
publish:
  provider: github
  owner: kuralayusha
  repo: CMAE
  releaseType: release
mac:
  category: public.app-category.productivity
  # zip required for electron-updater; dmg for humans
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  # Unsigned when CSC_LINK unset + CSC_IDENTITY_AUTO_DISCOVERY=false.
  # CI sets MAC_CSC_LINK for Developer ID + notarize.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: desktop/build/entitlements.mac.plist
  entitlementsInherit: desktop/build/entitlements.mac.plist
dmg:
  artifactName: CMAE-${version}-mac-${arch}.${ext}
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: CMAE-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # Keep %APPDATA%/CMAE across reinstalls (update scenario)
  deleteAppDataOnUninstall: false
