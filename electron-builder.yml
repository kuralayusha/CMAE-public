appId: app.cmae.desktop
productName: CMAE
copyright: Copyright CMAE
directories:
  output: dist-desktop
  buildResources: desktop/build
# Pack shell from desktop-pack/ (plain or obfuscated) as desktop/
files:
  - from: desktop-pack
    to: desktop
  - package.json
afterPack: scripts/after-pack.cjs
afterSign: scripts/notarize.cjs
# Public CDN (Vercel Blob). CI uploads artefacts via scripts/upload-desktop-blob.mjs.
# Repo stays private — landing + electron-updater use this feed URL.
publish:
  provider: generic
  url: https://j99zof4rag1z9ajs.public.blob.vercel-storage.com/releases
mac:
  category: public.app-category.productivity
  # zip required for electron-updater; dmg for humans
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  # Local builds: force unsigned (avoids ambiguous "Apple Development" keychain
  # identities). CI runs scripts/ci-enable-mac-signing.mjs to strip this, then
  # signs with MAC_CSC_LINK when present.
  identity: null
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: desktop/build/entitlements.mac.plist
  entitlementsInherit: desktop/build/entitlements.mac.plist

dmg:
  artifactName: CMAE-${version}-mac-${arch}.${ext}
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: CMAE-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # Keep %APPDATA%/CMAE across reinstalls (update scenario)
  deleteAppDataOnUninstall: false
