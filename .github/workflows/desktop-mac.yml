name: Desktop Mac

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "desktop/**"
      - "scripts/prepare-desktop.mjs"
      - "scripts/obfuscate-desktop.mjs"
      - "scripts/notarize.cjs"
      - "scripts/desktop-dev.mjs"
      - "scripts/after-pack.cjs"
      - "version-policy.json"
      - "electron-builder.yml"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-mac.yml"

concurrency:
  group: desktop-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dmg:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Allow Mac codesign (strip identity: null)
        run: node scripts/ci-enable-mac-signing.mjs

      - name: Build Mac desktop app
        run: npm run desktop:build:mac
        env:
          # Without MAC_CSC_LINK → unsigned artefact. With secret → Developer ID sign.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload DMG artefact
        uses: actions/upload-artifact@v4
        with:
          name: CMAE-mac-dmg
          path: dist-desktop/*.dmg
          if-no-files-found: error
          retention-days: 14
