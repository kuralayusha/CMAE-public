name: Desktop Mac

on:
  workflow_dispatch:

concurrency:
  group: desktop-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dmg:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # secrets cannot be used in step `if:` — mirror into env first
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # electron-builder CSC_LINK path is buggy (set-key-partition-list uses p12
      # password instead of temp keychain password). Import into a real keychain
      # first, then let electron-builder discover the identity.
      - name: Import Apple signing certificate
        if: env.MAC_CSC_LINK != ''
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ env.MAC_CSC_LINK }}
          p12-password: ${{ env.MAC_CSC_KEY_PASSWORD }}

      - name: "Allow Mac codesign (strip identity null)"
        if: env.MAC_CSC_LINK != ''
        run: node scripts/ci-enable-mac-signing.mjs

      - name: Verify signing identity
        if: env.MAC_CSC_LINK != ''
        run: security find-identity -v -p codesigning

      - name: Build Mac desktop app
        run: npm run desktop:build:mac
        env:
          # Cert already in keychain — do NOT set CSC_LINK (triggers broken import).
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.MAC_CSC_LINK != '' && 'true' || 'false' }}

      - name: Upload DMG artefact
        uses: actions/upload-artifact@v4
        with:
          name: CMAE-mac-dmg
          path: dist-desktop/*.dmg
          if-no-files-found: error
          retention-days: 14
