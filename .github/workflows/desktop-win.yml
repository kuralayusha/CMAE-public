name: Desktop Win

on:
  workflow_dispatch:

concurrency:
  group: desktop-win-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-nsis:
    # windows-latest (2025) ships VS 18; better-sqlite3/node-gyp does not support it yet
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows desktop app
        run: npm run desktop:build:win
        env:
          # Artefact-only builds. Use Desktop Release + tag for signed publish.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload NSIS artefact
        uses: actions/upload-artifact@v4
        with:
          name: CMAE-win-nsis
          path: dist-desktop/*.exe
          if-no-files-found: error
          retention-days: 14
