name: Desktop Win

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "desktop/**"
      - "scripts/prepare-desktop.mjs"
      - "scripts/desktop-dev.mjs"
      - "scripts/after-pack.cjs"
      - "electron-builder.yml"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-win.yml"

concurrency:
  group: desktop-win-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-nsis:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows desktop app
        run: npm run desktop:build:win
        env:
          # Unsigned local distribution; SmartScreen may warn on first open
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload NSIS artefact
        uses: actions/upload-artifact@v4
        with:
          name: CMAE-win-nsis
          path: dist-desktop/*.exe
          if-no-files-found: error
          retention-days: 14
