name: Desktop Release

# Manual only (saves Actions minutes). Bump package.json + version-policy.json,
# then run this workflow from the Actions tab — optionally pass tag (e.g. v0.2.0).
# Builds signed (when secrets exist) + obfuscated Mac/Win artefacts and
# uploads them to the public repo kuralayusha/cmae-releases (source stays private).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Expected version tag (e.g. v0.1.0). Code comes from the branch selected above — not an old tag commit."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release-mac:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # PAT with contents:write on kuralayusha/cmae-releases (GITHUB_TOKEN cannot write another repo).
      RELEASES_GITHUB_TOKEN: ${{ secrets.RELEASES_GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify package version vs requested tag
        if: ${{ inputs.tag != '' }}
        shell: bash
        run: |
          EXPECTED="${{ inputs.tag }}"
          EXPECTED="${EXPECTED#v}"
          ACTUAL=$(node -p "require('./package.json').version")
          echo "package.json=${ACTUAL} requested_tag=${EXPECTED}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::package.json version ($ACTUAL) does not match requested tag ($EXPECTED). Bump version or pass the matching tag."
            exit 1
          fi

      - name: Require releases token
        run: |
          if [ -z "$RELEASES_GITHUB_TOKEN" ]; then
            echo "::error::Add GitHub secret RELEASES_GITHUB_TOKEN (PAT with contents:write on kuralayusha/cmae-releases)"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Import Apple signing certificate
        if: env.MAC_CSC_LINK != ''
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ env.MAC_CSC_LINK }}
          p12-password: ${{ env.MAC_CSC_KEY_PASSWORD }}

      - name: "Allow Mac codesign (strip identity null)"
        if: env.MAC_CSC_LINK != ''
        run: node scripts/ci-enable-mac-signing.mjs

      - name: Verify signing identity
        if: env.MAC_CSC_LINK != ''
        run: security find-identity -v -p codesigning

      - name: Build + upload Mac → cmae-releases
        run: npm run desktop:publish:mac
        env:
          CMAE_OBFUSCATE: "1"
          GH_TOKEN: ${{ env.RELEASES_GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.MAC_CSC_LINK != '' && 'true' || 'false' }}

  release-win:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      RELEASES_GITHUB_TOKEN: ${{ secrets.RELEASES_GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify package version vs requested tag
        if: ${{ inputs.tag != '' }}
        shell: bash
        run: |
          EXPECTED="${{ inputs.tag }}"
          EXPECTED="${EXPECTED#v}"
          ACTUAL=$(node -p "require('./package.json').version")
          echo "package.json=${ACTUAL} requested_tag=${EXPECTED}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::package.json version ($ACTUAL) does not match requested tag ($EXPECTED). Bump version or pass the matching tag."
            exit 1
          fi

      - name: Require releases token
        shell: bash
        run: |
          if [ -z "$RELEASES_GITHUB_TOKEN" ]; then
            echo "::error::Add GitHub secret RELEASES_GITHUB_TOKEN"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build + upload Windows → cmae-releases
        run: npm run desktop:publish:win
        env:
          CMAE_OBFUSCATE: "1"
          GH_TOKEN: ${{ env.RELEASES_GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
