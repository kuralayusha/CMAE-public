name: Desktop Release

# Tag a version (v0.2.0) after bumping package.json + version-policy.json.
# Builds signed (when secrets exist) + obfuscated Mac/Win artefacts and
# publishes them to the GitHub Release for that tag.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild/publish (e.g. v0.2.0)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-mac:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build + publish Mac
        run: npm run desktop:publish:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CMAE_OBFUSCATE: "1"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # Developer ID Application .p12 (base64) — optional
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  release-win:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build + publish Windows
        shell: bash
        run: npm run desktop:publish:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CMAE_OBFUSCATE: "1"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # Authenticode .pfx (base64) — optional
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
