name: Desktop Release

# Tag a version (v0.2.0) after bumping package.json + version-policy.json.
# Builds signed (when secrets exist) + obfuscated Mac/Win artefacts and
# uploads them to public Vercel Blob (landing + electron-updater CDN).
# Repo can stay private — downloads do not go through GitHub Releases.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild/publish (e.g. v0.1.0)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release-mac:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Require Blob token
        run: |
          if [ -z "$BLOB_READ_WRITE_TOKEN" ]; then
            echo "::error::Add GitHub secret BLOB_READ_WRITE_TOKEN (from Vercel → Storage → cmae-releases → .env.local)"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Import Apple signing certificate
        if: env.MAC_CSC_LINK != ''
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ env.MAC_CSC_LINK }}
          p12-password: ${{ env.MAC_CSC_KEY_PASSWORD }}

      - name: "Allow Mac codesign (strip identity null)"
        if: env.MAC_CSC_LINK != ''
        run: node scripts/ci-enable-mac-signing.mjs

      - name: Verify signing identity
        if: env.MAC_CSC_LINK != ''
        run: security find-identity -v -p codesigning

      - name: Build + upload Mac → Blob
        run: npm run desktop:publish:mac
        env:
          CMAE_OBFUSCATE: "1"
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.MAC_CSC_LINK != '' && 'true' || 'false' }}

  release-win:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Require Blob token
        shell: bash
        run: |
          if [ -z "$BLOB_READ_WRITE_TOKEN" ]; then
            echo "::error::Add GitHub secret BLOB_READ_WRITE_TOKEN"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build + upload Windows → Blob
        shell: bash
        run: npm run desktop:publish:win
        env:
          CMAE_OBFUSCATE: "1"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
